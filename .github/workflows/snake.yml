name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff9a1f&color_dots=#2b1c10,#5a3a10,#a86a14,#e08c18,#ffb347
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff9a1f&color_dots=#1a0e04,#3d2a17,#7a5c33,#c9871f,#ffb347

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
