name: Update Worldline

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  worldline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update worldline block
        shell: python
        run: |
          import re, random
          from datetime import datetime, timezone, timedelta

          now = datetime.now(timezone(timedelta(hours=8)))
          status = "Reading Steiner — ACTIVE ⚠" if random.random() < 0.05 else "Reading Steiner — INACTIVE"
          block = (
              "<!--WORLDLINE:START-->\n"
              "```text\n"
              " [LAB MEM 004] WORLDLINE OBSERVATION LOG\n"
              " ─────────────────────────────────────────────\n"
              "  Divergence     : 1.048596 %  (Steins;Gate)\n"
              f"  Lab Time (CST) : {now:%Y-%m-%d %H:%M}\n"
              f"  Status         : {status}\n"
              "  Operation      : SKULD — profile auto-sync OK\n"
              " ─────────────────────────────────────────────\n"
              "```\n"
              "<!--WORLDLINE:END-->"
          )
          with open("README.md", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r"<!--WORLDLINE:START-->.*?<!--WORLDLINE:END-->", block, content, flags=re.S)
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: worldline sync"
          git push
